name: Sync Catalog with KitaboSunnat

on:
  schedule:
    # Run every 3 days at 02:00 UTC
    - cron: '0 2 */3 * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run catalog synchronization & update data/books.json
        run: |
          python sync_catalog.py

      - name: Commit and push if catalog updated
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action [Catalog Sync]"
          git add books.xls images-sitemap.xml kitabosunnat.db data/books.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update library catalog & direct PDF links [skip ci]" && git push)
